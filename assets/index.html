<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDrive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    .loader-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <div>
      <div class="title">DevDrive Başlatılıyor</div>
      <div class="subtitle">Lütfen bekleyin...</div>
    </div>
  </div>
  <script>
    async function boot() {
      const targetUrl = 'http://127.0.0.1:4040';
      for (let i = 0; i < 100; i++) {
        try {
          const res = await fetch(targetUrl + '/api/status', { method: 'GET' });
          if (res.ok) {
            window.location.replace(targetUrl);
            return;
          }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 60));
      }
      window.location.replace(targetUrl);
    }
    boot();
  </script>
</body>
</html>
