<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cloud / Drive Outer Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Tiered Storage Stack Gradient -->
    <linearGradient id="platterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle Radial Ambient Light -->
  <circle cx="256" cy="220" r="160" fill="#0284c7" opacity="0.2" filter="url(#glow)"/>

  <!-- Tiered Storage Stack (Base Plates) -->
  <!-- Bottom Platter (Cold Cloud Tier) -->
  <path d="M 140 370 C 140 355, 372 355, 372 370 C 372 385, 140 385, 140 370 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M 140 370 C 140 388, 372 388, 372 370 L 372 382 C 372 400, 140 400, 140 382 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Middle Platter (Warm Cache Tier) -->
  <path d="M 155 345 C 155 332, 357 332, 357 345 C 357 358, 155 358, 155 345 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <path d="M 155 345 C 155 360, 357 360, 357 345 L 357 354 C 357 369, 155 369, 155 354 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- Top Active SSD Platter (Hot NVMe Tier with Glow) -->
  <path d="M 170 320 C 170 308, 342 308, 342 320 C 342 332, 170 332, 170 320 Z" fill="url(#platterGrad)" opacity="0.9" filter="url(#softGlow)"/>

  <!-- The Smart Cloud Silhouette (Upper Tier) -->
  <path d="M 200 240 
           A 55 55 0 0 1 290 190 
           A 45 45 0 0 1 355 230 
           A 40 40 0 0 1 345 285 
           L 180 285 
           A 45 45 0 0 1 200 240 Z" 
        fill="url(#cloudGrad)" 
        stroke="#38bdf8" 
        stroke-width="1.5"
        filter="url(#softGlow)"/>

  <!-- Neon Data Flow Rings (Linking Cloud & Local Storage) -->
  <ellipse cx="256" cy="285" rx="100" ry="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Foreground Electric Lightning Bolt (Speed & Instant Sync) -->
  <polygon points="275,130 205,250 255,250 235,350 320,225 265,225" 
           fill="url(#boltGrad)" 
           filter="url(#glow)"/>

  <!-- Status Indicator Dot (Apple Green Active LED) -->
  <circle cx="420" cy="92" r="10" fill="#10b981" filter="url(#softGlow)"/>
  <circle cx="420" cy="92" r="4" fill="#ecfdf5"/>
</svg>
